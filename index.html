<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python Masterclass – Visual Explainer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--page:#EDEDF2;--ink:#1D1D1F;--sub:#515154;--btn:#0071E3;--chip:#fff;--chipb:#D2D2D7;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#0E0E10;--ink:#F5F5F7;--sub:#A1A1A6;--chip:#1C1C1E;--chipb:#3A3A3C}}
:root[data-theme="dark"]{--page:#0E0E10;--ink:#F5F5F7;--sub:#A1A1A6;--chip:#1C1C1E;--chipb:#3A3A3C}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--page);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:Inter,system-ui,sans-serif;overflow:hidden;color:var(--ink)}
#wrap{width:min(96vw,calc((100vh - 150px) * 16 / 9));aspect-ratio:16/9;position:relative;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px -20px rgba(0,0,0,.35);flex:none}
#stage{width:1920px;height:1080px;position:absolute;left:0;top:0;transform-origin:0 0;background:radial-gradient(circle at 70% 45%,rgba(0,113,227,.08) 0%,transparent 60%),#FAFAFC;color:#1D1D1F}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700}
.chip{position:absolute;left:80px;top:58px;font-weight:800;font-size:38px;color:#515154}
.chip b{color:#0071E3}
.dots{position:absolute;right:80px;top:70px;display:flex;gap:10px}
.dots i{width:18px;height:18px;border-radius:50%;background:#D2D2D7;transition:.4s;cursor:pointer}
.dots i.on{background:#0071E3;box-shadow:0 0 14px rgba(0,113,227,.6)}
.pbar{position:absolute;left:0;right:0;top:0;height:8px;background:rgba(0,0,0,.05)}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0071E3,#AF52DE)}
/* code */
.code{position:absolute;left:80px;top:150px;width:720px;background:rgba(255,255,255,.88);border:1px solid rgba(0,0,0,.08);border-radius:20px;box-shadow:0 10px 40px -10px rgba(0,0,0,.08);overflow:hidden}
.code .bar{height:50px;display:flex;align-items:center;gap:10px;padding-left:22px;border-bottom:1px solid rgba(0,0,0,.06)}
.code .bar i{width:14px;height:14px;border-radius:50%}
#codeLines{padding:10px 0}
.ln{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:30px;padding:0 24px;height:62px;line-height:62px;color:#6E6E73;white-space:pre;border-left:6px solid transparent;transition:.35s}
.ln.act{background:rgba(0,113,227,.1);border-left-color:#0071E3;color:#1D1D1F}
.kw,.dc{color:#AF52DE}.bi{color:#00776F}.st{color:#B25E00}.nu{color:#0071E3}.cm{color:#86868B}
.console{position:absolute;left:80px;top:738px;width:720px;box-sizing:border-box;padding:16px 26px;background:#1D1D1F;color:#A8F5C8;border-radius:16px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:30px;opacity:0;transition:.4s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.console.show{opacity:1}
.console:before{content:'▸ ';color:#6E6E73}
/* visual area */
#vis{position:absolute;left:860px;top:150px;width:960px;height:640px}
.th-svg{position:absolute;left:0;top:0;width:960px;height:640px;overflow:visible;pointer-events:none}
.th{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .9s ease,opacity .4s}
.th.on{stroke-dashoffset:0}
.o{position:absolute;box-sizing:border-box;opacity:0;transform:translateY(24px) scale(.92);transition:opacity .6s,transform .6s cubic-bezier(.2,.9,.3,1),left .8s cubic-bezier(.2,.9,.3,1),top .8s cubic-bezier(.2,.9,.3,1),background .4s,border-color .4s,box-shadow .4s,color .4s}
.o.on{opacity:1;transform:none}
.o.dim{opacity:.28}
.card{background:rgba(255,255,255,.93);border:2px solid #D2D2D7;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:32px;font-weight:700;text-align:center;box-shadow:0 10px 40px -12px rgba(0,0,0,.12);z-index:1}
.card.row{flex-direction:row;justify-content:flex-start;gap:24px;padding:0 28px;font-size:34px}
.blue{border-color:#0071E3;box-shadow:0 0 26px rgba(0,113,227,.3)}
.purple{border-color:#AF52DE;box-shadow:0 0 26px rgba(175,82,222,.3)}
.cyan{border-color:#00C7BE;box-shadow:0 0 26px rgba(0,199,190,.3)}
.amber{border-color:#FF9500;box-shadow:0 0 26px rgba(255,149,0,.3)}
.green{border-color:#34C759;box-shadow:0 0 26px rgba(52,199,89,.3)}
.red{border-color:#FF3B30;box-shadow:0 0 26px rgba(255,59,48,.3)}
.hi{border-color:#0071E3!important;box-shadow:0 0 30px rgba(0,113,227,.5)!important;background:#EAF3FF!important}
.ok{border-color:#34C759!important;box-shadow:0 0 30px rgba(52,199,89,.45)!important;background:#EBFAEF!important}
.bad{border-color:#FF3B30!important;box-shadow:0 0 30px rgba(255,59,48,.4)!important;background:#FFECEA!important}
.warn{border-color:#FF9500!important;box-shadow:0 0 30px rgba(255,149,0,.4)!important;background:#FFF4E5!important}
.big{font-size:52px}.sm{font-size:26px;font-weight:600;color:#515154;font-family:Inter,sans-serif}
.tb{color:#0071E3}.tp{color:#AF52DE}.tc{color:#00776F}.ta{color:#B25E00}.tr{color:#C0281F}.tg{color:#1B7F3A}.ts{color:#515154}
.lab{display:flex;justify-content:center;align-items:center;font-weight:700;font-size:30px;color:#515154;text-align:center;white-space:nowrap}
.tag{display:flex;align-items:center;justify-content:center;background:#fff;border:2px solid #D2D2D7;border-radius:34px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:34px;z-index:1}
.tag.blue{color:#0071E3}.tag.purple{color:#AF52DE}
.pill{display:flex;align-items:center;justify-content:center;background:#fff;border:2px solid #D2D2D7;border-radius:28px;font-weight:700;font-size:30px;z-index:2}
.circ{border-radius:50%;border:3px solid;z-index:0}
.circ.blue{background:rgba(0,113,227,.07)}.circ.purple{background:rgba(175,82,222,.07)}
.dot{width:34px;height:34px;border-radius:50%;background:#0071E3;box-shadow:0 0 18px rgba(0,113,227,.7);z-index:3}
.divider{background:#D2D2D7;border-radius:3px}
.star{display:flex;align-items:center;justify-content:center;font-size:64px;color:#0071E3;text-shadow:0 0 14px rgba(0,113,227,.5)}
.bot{display:flex;align-items:center;justify-content:center;font-size:70px;z-index:3}
.room{border:3px dashed;border-radius:28px;background:rgba(255,255,255,.55)}
.room.blue{border-color:#0071E3}.room.purple{border-color:#AF52DE}
.rl{position:absolute;left:24px;top:14px;font-weight:800;font-size:30px;font-family:'JetBrains Mono',monospace}
.orb{border-radius:50%}
.kc{width:270px;color:#0071E3;text-align:left}
.tth{font-weight:800;font-size:38px;margin-bottom:6px}
.ttr{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:34px;white-space:pre;padding:2px 22px;border-radius:10px;margin:2px 0}
.ttr.rh{background:rgba(0,113,227,.15)}
@keyframes pulse{50%{transform:scale(1.12)}}.pulse{animation:pulse .6s}
/* captions */
.cap{position:absolute;left:50%;bottom:62px;transform:translate(-50%,30px);width:max-content;max-width:1640px;box-sizing:border-box;padding:24px 48px;border-radius:56px;background:rgba(255,255,255,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(0,0,0,.08);box-shadow:0 10px 40px -10px rgba(0,0,0,.12);font-size:36px;font-weight:700;line-height:1.3;text-align:center;opacity:0;transition:all .55s cubic-bezier(.2,.9,.3,1);z-index:5}
.cap.show{opacity:1;transform:translate(-50%,0)}
.cap em{font-style:normal;margin-right:14px}
.end{position:absolute;left:80px;right:80px;bottom:50px;display:flex;gap:36px;opacity:0;transform:translateY(40px);transition:all .8s cubic-bezier(.2,.9,.3,1);pointer-events:none;z-index:6}
.end.show{opacity:1;transform:none}
.end div{flex:1;padding:26px 34px;border-radius:24px;background:rgba(255,255,255,.96);border:1px solid rgba(0,0,0,.08);box-shadow:0 10px 40px -10px rgba(0,0,0,.14);font-size:32px;font-weight:700;line-height:1.3}
.end small{display:block;font-size:26px;color:#515154;margin-bottom:8px;font-weight:800;letter-spacing:.03em}
/* controls */
#controls{display:flex;gap:10px;align-items:center;color:var(--sub);font-size:15px;flex:none;flex-wrap:wrap;justify-content:center}
button{font:600 15px Inter,sans-serif;background:var(--btn);color:#fff;border:0;border-radius:999px;padding:8px 18px;cursor:pointer}
select{font:600 14px Inter,sans-serif;border-radius:8px;padding:6px 8px}
label{display:flex;align-items:center;gap:6px;cursor:pointer}
#chapters{display:flex;gap:8px;overflow-x:auto;max-width:96vw;padding:2px 4px 6px;flex:none}
#chapters button{background:var(--chip);color:var(--ink);border:1px solid var(--chipb);font-size:14px;padding:7px 14px;white-space:nowrap;flex:none}
#chapters button.on{background:var(--btn);color:#fff;border-color:var(--btn)}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div class="pbar"><i id="pfill"></i></div>
  <div class="chip" id="chip"></div>
  <div class="dots" id="dots"></div>
  <div class="code"><div class="bar"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i></div><div id="codeLines"></div></div>
  <div class="console" id="console"><span id="outTxt"></span></div>
  <div id="vis"></div>
  <div class="cap" id="cap"></div>
  <div class="end" id="end"></div>
</div></div>
<div id="controls">
  <button id="bPrev">⏮ Prev</button><button id="bPlay">⏸ Pause</button><button id="bNext">Next ⏭</button><button id="bRe">↻ Replay</button>
  <select id="spd"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select>
  <label><input type="checkbox" id="auto" checked> Auto-next</label>
  <span>Space = pause · ← → = chapter · click a dot = jump to step</span>
</div>
<div id="chapters"></div>

<script>
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
let X={},svg,timers=[],cur=0,t=0,si=-1,playing=true,spd=1,starts=[],total=1,capT=null;
const T=(fn,ms)=>{timers.push(setTimeout(fn,ms))};
const raf2=fn=>requestAnimationFrame(()=>requestAnimationFrame(fn));
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const RX=/(#.*$)|('[^']*'|"[^"]*")|\b(def|return|if|elif|else|for|while|in|and|or|not|match|case|break|continue|lambda|import|from|None|True|False)\b|\b(print|len|list|set|dict|zip|range|filter|map|reduce|id|type|int|float|frozenset|array|sum|wraps)\b|\b(\d+\.?\d*)\b|(@\w+)/g;
function hl(s){return esc(s).replace(RX,(m,c,s2,k,b,n,d)=>c?`<span class="cm">${c}</span>`:s2?`<span class="st">${s2}</span>`:k?`<span class="kw">${k}</span>`:b?`<span class="bi">${b}</span>`:n?`<span class="nu">${n}</span>`:`<span class="dc">${d}</span>`)}

/* ---------- visual helpers ---------- */
function clearV(){const v=$('vis');v.innerHTML='';svg=document.createElementNS(NS,'svg');svg.setAttribute('class','th-svg');svg.setAttribute('viewBox','0 0 960 640');v.appendChild(svg)}
function mk(html,x,y,w,h,cls,st){const d=document.createElement('div');d.className='o '+(cls||'');d.style.cssText='left:'+x+'px;top:'+y+'px;'+(w?'width:'+w+'px;':'')+(h?'height:'+h+'px;':'')+(st||'');d.innerHTML=html;d._g={x,y};$('vis').appendChild(d);raf2(()=>d.classList.add('on'));return d}
const card=(h,x,y,w,hh,c)=>mk(h,x,y,w,hh,'card '+(c||''));
const lab=(h,x,y,w,c)=>mk(h,x,y,w,0,'lab '+(c||''));
const M=(h,fs)=>`<span class="mono" style="font-size:${fs||34}px">${h}</span>`;
const pad=(tx,x,y,s,c)=>card(M(tx,s>70?34:28),x,y,s,s,c||'');
function mv(d,x,y){d._g={x,y};d.style.left=x+'px';d.style.top=y+'px'}
function gone(d,ms){if(!d)return;d.classList.remove('on');setTimeout(()=>d.remove(),ms||650)}
function setHtml(d,h){d.innerHTML=h}
function pulse(d){d.classList.remove('pulse');void d.offsetWidth;d.classList.add('pulse');setTimeout(()=>d.classList.remove('pulse'),700)}
function link(a,b,col){const ax=a._g.x+a.offsetWidth,ay=a._g.y+a.offsetHeight/2,bx=b._g.x,by=b._g.y+b.offsetHeight/2,mx=(ax+bx)/2;
  const p=document.createElementNS(NS,'path');p.setAttribute('d',`M${ax} ${ay} C${mx} ${ay} ${mx} ${by} ${bx} ${by}`);p.setAttribute('pathLength','1');p.setAttribute('class','th');p.style.stroke=col||'#0071E3';p.style.filter='drop-shadow(0 0 5px '+(col||'#0071E3')+')';svg.appendChild(p);raf2(()=>p.classList.add('on'));return p}
function seg(x1,y1,x2,y2,col){const p=document.createElementNS(NS,'path');p.setAttribute('d',`M${x1} ${y1} L${x2} ${y2}`);p.setAttribute('pathLength','1');p.setAttribute('class','th');p.style.stroke=col||'#0071E3';p.style.opacity='.55';svg.appendChild(p);raf2(()=>p.classList.add('on'));return p}
function unlink(p){if(!p)return;p.style.opacity=0;setTimeout(()=>p.remove(),500)}
function res(h,c,y,w){if(X.r)gone(X.r);const ww=w||800;X.r=card(M(h,34),(960-ww)/2,y||440,ww,84,c||'cyan');return X.r}
function unres(){if(X.r){gone(X.r);X.r=null}}
function out(s){$('outTxt').textContent=s;$('console').classList.toggle('show',!!s)}
function setCode(l){$('codeLines').innerHTML=l.map(x=>`<div class="ln">${hl(x)}</div>`).join('')}
function hlLine(a){[...$('codeLines').children].forEach((e,i)=>e.classList.toggle('act',Array.isArray(a)?(i>=a[0]&&i<=a[1]):i===a))}
function hlN(l){Object.entries(X.n).forEach(([n,e])=>{e.classList.toggle('hi',!!l&&l.includes(n));e.classList.toggle('dim',!!l&&!l.includes(n))})}

/* ---------- scenes ---------- */
const S=[];

/* 1 */
S.push({title:'How Python Works',code:['print("hello")'],steps:[
{ms:3800,line:0,m:'Hit Run, and Python does not talk to the computer directly.',run(){
  X.data=[['📄','Source','hello.py'],['⚙️','Compiler','translates'],['📦','Bytecode','.pyc'],['🤖','PVM','runs it'],['🖥️','Output','hello']];X.b=[];
  X.show=i=>{const d=X.data[i];X.b[i]=card(`<div style="font-size:60px">${d[0]}</div><div>${d[1]}</div><div class="sm">${d[2]}</div>`,i*197,70,170,200,['blue','purple','cyan','amber','green'][i]);if(i>0)lab('→',i*197-27,140,27).style.fontSize='40px'};
  X.show(0);X.p=mk('',68,153,0,0,'dot');}},
{ms:4200,k:'Python translates your text into a secret robot recipe.',run(){X.show(1);mv(X.p,265,153)}},
{ms:4800,m:'Bytecode is a short list of simple instructions a machine can follow.',run(){X.show(2);mv(X.p,462,153);
  X.bc=card(`<div class="mono" style="text-align:left;font-size:34px;line-height:1.55"><span class="tp">LOAD_NAME</span>  print<br><span class="tp">LOAD_CONST</span> 'hello'<br><span class="tp">CALL</span>       1</div>`,150,330,660,180,'purple')}},
{ms:5000,k:'The PVM robot reads the recipe one step at a time, then shows the result.',run(){X.show(3);mv(X.p,659,153);T(()=>{X.show(4);mv(X.p,856,153);out('hello')},1800)}},
{ms:6200,tip:'Interpreted or compiled? Both: compiled to .pyc bytecode, then interpreted by the PVM.',rule:'Source → bytecode → PVM → output. Every time.'}
]});

/* 2 */
S.push({title:'Data Types & Casting',code:['z = 67','y = 12.5',`x = 'ajay'`,'b = True','n = None'],steps:[
{ms:3800,line:0,m:'Every value has a type. It tells Python what kind of data we hold.',run(){
  X.tc=(v,ty,i,tc,bc)=>card(`<div class="mono big ${tc}">${v}</div><div class="sm mono">&lt;class '${ty}'&gt;</div>`,(i%3)*325,Math.floor(i/3)*250+20,290,210,bc);X.tc('67','int',0,'tb','blue')}},
{ms:3200,line:1,run(){X.tc('12.5','float',1,'tc','cyan')}},
{ms:4200,line:2,k:'int is a whole number, float has a point, str is text in quotes.',run(){X.tc("'ajay'",'str',2,'tp','purple')}},
{ms:3200,line:3,run(){X.tc('True','bool',3,'ta','amber')}},
{ms:4200,line:4,m:'None means "nothing here", and it has its own type.',run(){X.tc('None','NoneType',4,'ts','')}},
{ms:7600,line:0,clr:true,code:[`x = 'sachin'`,'x[0]','x[1:4]',`x[0] = 'S'`],m:'Strings are sequences. Slice them with [start:stop].',run(){
  X.c=[...'sachin'].map((ch,i)=>card(M(ch,44),i*100+170,60,84,84,'purple'));[...'sachin'].forEach((_,i)=>lab(M(i,28),i*100+170,150,84,'ts'));
  const hi=a=>X.c.forEach((c,i)=>c.classList.toggle('hi',a.includes(i)));
  T(()=>{hlLine(1);hi([0]);res(`x[0] → 's'`,'blue',300,700)},1800);
  T(()=>{hlLine(2);hi([1,2,3]);res(`x[1:4] → 'ach'  (stop excluded)`,'blue',300,860)},3600);
  T(()=>{hlLine(3);hi([]);res('TypeError: str is immutable','red',300,800)},5600)}},
{ms:6400,line:0,clr:true,code:['y = float(5)','c = int(True)','i = int(False)'],m:'Type casting converts a value from one type into another.',run(){
  [['5','float()','5.0'],['True','int()','1'],['False','int()','0']].forEach((r,i)=>T(()=>{hlLine(i);const y=40+i*150;
    const a=card(M(r[0],40),40,y,220,100,'blue'),f=card(M(r[1],34),370,y,240,100,'purple'),b=card(M(r[2],40),720,y,200,100,'green');
    link(a,f,'#0071E3');T(()=>link(f,b,'#AF52DE'),500)},i*1400))}},
{ms:6800,tip:'Python has no long or double: int grows without limit, float is a 64-bit double.',rule:'type(x) shows the type. Cast True to 1 and False to 0 with int().'}
]});

/* 3 */
S.push({title:'Variables & Memory',code:['var1 = 17','var3 = 17','id(var1) == id(var3)'],steps:[
{ms:4200,line:0,m:'A variable is just a name. The value lives in memory as an object.',run(){
  X.o=card(M('17',60),420,60,200,150,'cyan');lab(M('id …159056',28),390,225,260,'tc');
  X.t1=mk('var1',0,90,170,64,'tag blue');T(()=>{X.l1=link(X.t1,X.o,'#0071E3')},700)}},
{ms:4200,line:1,k:'Both names are sticky notes tied to the same toy on the shelf.',run(){
  X.t2=mk('var3',0,260,170,64,'tag purple');T(()=>{link(X.t2,X.o,'#AF52DE')},700)}},
{ms:4200,line:2,m:'id() shows the address. The same address means the same object.',run(){res('id(var1) == id(var3) → True ✓','green',420,860);out('True')}},
{ms:3800,line:0,clr:true,code:['xyz = 44','abc = 55','xyz = 55'],m:'What happens to a value that no name points to?',run(){
  X.o44=card(M('44',54),420,20,200,130,'cyan');X.tx=mk('xyz',0,50,170,64,'tag blue');T(()=>{X.lx=link(X.tx,X.o44,'#0071E3')},700)}},
{ms:3800,line:1,k:'abc is a second sticky note on a second toy.',run(){
  X.o55=card(M('55',54),420,230,200,130,'cyan');X.ta=mk('abc',0,260,170,64,'tag purple');T(()=>{link(X.ta,X.o55,'#AF52DE')},700)}},
{ms:6000,line:2,m:'Move xyz to 55: object 44 has no names left, so it is garbage collected.',run(){
  unlink(X.lx);T(()=>{link(X.tx,X.o55,'#0071E3')},400);X.o44.classList.add('warn');lab('no references!',420,160,200,'ta');
  T(()=>{gone(X.o44);res('🗑 44 was collected from memory','amber',440,780)},2200)}},
{ms:7200,line:0,clr:true,code:[`a = 'sachin'`,`b = 'sachin'`,`t1 = 'hello my name is sachin..'`,`t2 = 'hello my name is sachin..'`],m:'Python reuses small ints and short strings. Long text may get its own object.',run(){
  hlLine([0,1]);card(`${M('short string',34)}<div class="sm">same text twice</div>${M('id equal ✓',36)}`,0,60,440,300,'green');
  T(()=>{hlLine([2,3]);card(`${M('long text',34)}<div class="sm">same text twice</div>${M('ids differ ✗',36)}`,500,60,440,300,'amber')},2600)}},
{ms:6600,tip:'Variables hold references. Assignment never copies. Compare values with ==, not id().',rule:'A name is a sticky note, not a box. Zero notes means garbage collected.'}
]});

/* 4 */

  const cap=$('cap'),end=$('end');clearTimeout(capT);
  if(st.tip||st.rule){cap.classList.remove('show');end.innerHTML=`<div><small>💡 INTERVIEW PRO-TIP</small>${st.tip}</div><div><small>⚡ KEY RULE</small>${st.rule}</div>`;end.classList.add('show');return}
  if(st.m||st.k){end.classList.remove('show');cap.classList.remove('show');const h=st.m?`<em>📌</em>${st.m}`:`<em>🧒</em>${st.k}`;capT=setTimeout(()=>{cap.innerHTML=h;cap.classList.add('show')},250)}
}
function runStep(j){
  si=j;const st=S[cur].steps[j];
  if(st.clr){clearV();X={}}
  if(st.code)setCode(st.code);
  if(st.line!==undefined)hlLine(st.line);
  caption(st);
  if(st.run)st.run();
  [...$('dots').children].forEach((d,k)=>d.classList.toggle('on',k<=j));
}
function loadScene(i,k){
  timers.forEach(clearTimeout);timers=[];clearTimeout(capT);
  cur=i;const sc=S[i];X={};clearV();setCode(sc.code);hlLine(-1);out('');
  $('cap').classList.remove('show');$('end').classList.remove('show');
  $('chip').innerHTML=`<b>${String(i+1).padStart(2,'0')}</b> &nbsp;${sc.title}`;
  starts=[];total=0;sc.steps.forEach(s=>{starts.push(total);total+=s.ms});
  $('dots').innerHTML=sc.steps.map((s,j)=>`<i data-j="${j}" title="Step ${j+1}"></i>`).join('');
  si=-1;t=0;
  document.querySelectorAll('#chapters button').forEach((b,j)=>b.classList.toggle('on',j===i));
  if(k>=0){for(let j=0;j<=k;j++)runStep(j);t=starts[k]}
}
function tick(){
  if(playing)t+=100*spd;const sc=S[cur];
  while(si+1<sc.steps.length&&t>=starts[si+1])runStep(si+1);
  $('pfill').style.width=Math.min(100,t/total*100)+'%';
  if(playing&&si===sc.steps.length-1&&t>=total+1200&&$('auto').checked&&cur<S.length-1)loadScene(cur+1,-1);
}
function fit(){$('stage').style.transform='scale('+($('wrap').clientWidth/1920)+')'}
addEventListener('resize',fit);
$('chapters').innerHTML=S.map((s,i)=>`<button data-i="${i}">${i+1} · ${s.title}</button>`).join('');
$('chapters').onclick=e=>{const b=e.target.closest('button');if(b)loadScene(+b.dataset.i,-1)};
$('dots').onclick=e=>{const d=e.target.closest('i');if(d)loadScene(cur,+d.dataset.j)};
$('bPrev').onclick=()=>loadScene(Math.max(0,cur-1),-1);
$('bNext').onclick=()=>loadScene(Math.min(S.length-1,cur+1),-1);
$('bRe').onclick=()=>loadScene(cur,-1);
$('bPlay').onclick=()=>{playing=!playing;$('bPlay').textContent=playing?'⏸ Pause':'▶ Play'};
$('spd').onchange=e=>{spd=+e.target.value};
addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('bNext').click();else if(e.key==='ArrowLeft')$('bPrev').click();else if(e.key===' '){e.preventDefault();$('bPlay').click()}});
fit();loadScene(0,-1);setInterval(tick,100);
</script>
</body>
</html>
